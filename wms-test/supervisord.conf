[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=postgres -D /var/lib/postgresql/data -c listen_addresses=* -c port=5432
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.log
startsecs=5
priority=1

[program:fg-backend]
command=/app/wrappers/fg-backend.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/fg-backend.log
stderr_logfile=/var/log/fg-backend.log
startsecs=10
priority=2

[program:fg-frontend]
command=/app/wrappers/fg-frontend.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/fg-frontend.log
stderr_logfile=/var/log/fg-frontend.log
startsecs=10
priority=4

[program:rm-backend]
command=/app/wrappers/rm-backend.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/rm-backend.log
stderr_logfile=/var/log/rm-backend.log
startsecs=10
priority=3

[program:rm-frontend]
command=/app/wrappers/rm-frontend.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/rm-frontend.log
stderr_logfile=/var/log/rm-frontend.log
startsecs=10
priority=5
