[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=postgres -D /var/lib/postgresql/data -c listen_addresses=* -c port=5432
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.log
startsecs=5
priority=1

[program:fg-backend]
command=node dist/main
directory=/app/fg-backend
environment=PORT=3013,DATABASE_URL=postgresql://wms_user:wms_password@localhost:5432/wms_db,JWT_SECRET=fg_super_secret_key_change_me
autostart=true
autorestart=true
stdout_logfile=/var/log/fg-backend.log
stderr_logfile=/var/log/fg-backend.log
startsecs=10
priority=2

[program:rm-backend]
command=node dist/main
directory=/app/rm-backend
environment=PORT=3011,DATABASE_URL=postgresql://wms_user:wms_password@localhost:5432/wms_db,JWT_SECRET=rm_super_secret_key_change_me
autostart=true
autorestart=true
stdout_logfile=/var/log/rm-backend.log
stderr_logfile=/var/log/rm-backend.log
startsecs=10
priority=3

[program:fg-frontend]
command=npm start
directory=/app/fg-frontend
environment=NEXT_PUBLIC_API_URL=http://localhost:3013
autostart=true
autorestart=true
stdout_logfile=/var/log/fg-frontend.log
stderr_logfile=/var/log/fg-frontend.log
startsecs=10
priority=4

[program:rm-frontend]
command=npm start
directory=/app/rm-frontend
environment=PORT=3000
autostart=true
autorestart=true
stdout_logfile=/var/log/rm-frontend.log
stderr_logfile=/var/log/rm-frontend.log
startsecs=10
priority=5
