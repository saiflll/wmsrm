version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wms_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: rennnagge/wms_backend:latest
    container_name: wms_backend
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    image: rennnagge/wms_frontend:latest
    container_name: wms_frontend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
