# ============================================================
# WMS All-in-One Docker Compose (RM + FG)
# 
# Usage:
#   docker compose -f docker-compose.all.yml up -d --build
#   docker compose -f docker-compose.all.yml down
# ============================================================

services:
  # --- Shared PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: wms_all_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_password
      POSTGRES_DB: wms_db
    ports:
      - "5432:5432"
    volumes:
      - wms_all_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wms_user", "-d", "wms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wms-all-net

  # --- RM Backend (NestJS) ---
  rm-backend:
    build:
      context: ./rm/backend
      dockerfile: Dockerfile
    container_name: rm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wms_user:wms_password@db:5432/wms_db
      JWT_SECRET: rm_super_secret_key_change_me
      PORT: 3001
    ports:
      - "3011:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wms-all-net

  # --- RM Frontend (Next.js) ---
  rm-frontend:
    build:
      context: ./rm/frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://localhost:3011
    container_name: rm_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - rm-backend
    networks:
      - wms-all-net

  # --- FG Backend (NestJS) ---
  fg-backend:
    build:
      context: ./fg/backend
      dockerfile: Dockerfile
    container_name: fg_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wms_user:wms_password@db:5432/wms_db
      JWT_SECRET: fg_super_secret_key_change_me
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wms-all-net

  # --- FG Frontend (Next.js) ---
  fg-frontend:
    build:
      context: ./fg/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3003
    container_name: fg_frontend
    restart: unless-stopped
    ports:
      - "3004:3004"
    depends_on:
      - fg-backend
    networks:
      - wms-all-net

volumes:
  wms_all_pgdata:

networks:
  wms-all-net:
    driver: bridge
