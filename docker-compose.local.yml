version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wms_db_local
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wms_password}
      POSTGRES_DB: ${POSTGRES_DB:-wms_db}
    ports:
      - "4321:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

  backend:
    image: wms-backend-local:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms_backend_local
    restart: always
    env_file:
      - .env.local
    environment:
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      - db

  frontend:
    image: wms-frontend-local:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms_frontend_local
    restart: always
    env_file:
      - .env.local
    environment:
      - PORT=3001
      - BACKEND_API_URL=http://backend:3002
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_local_data:
