version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: wms_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "4321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: wms-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms_backend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      - db

  frontend:
    image: wms-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms_frontend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3001
      - BACKEND_API_URL=http://backend:3002
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
