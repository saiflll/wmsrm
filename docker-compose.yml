services:
  wms-db:
    image: postgres:15-alpine
    container_name: wms-db-test
    restart: unless-stopped
    ports:
      - "3022:5432"
    environment:
      - POSTGRES_USER=wms_user
      - POSTGRES_PASSWORD=wms_password
      - POSTGRES_DB=wms_db
    volumes:
      - wms_db_data:/var/lib/postgresql/data

  wms-backend:
    build:
      context: ./rm/backend
      dockerfile: Dockerfile
    container_name: wms-backend
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - PORT=3011
      - JWT_SECRET=rm_super_secret_key_change_me
      - DATABASE_URL=postgres://wms_user:wms_password@wms-db:5432/wms_db
    depends_on:
      - wms-db

  wms-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - BACKEND_API_URL=http://wms-backend:3011
    container_name: wms-frontend
    restart: unless-stopped
    ports:
      - "3015:3000"
    environment:
      - BACKEND_API_URL=http://wms-backend:3011
      - NEXT_PUBLIC_API_URL=http://localhost:3011
    depends_on:
      - wms-backend

volumes:
  wms_db_data:
