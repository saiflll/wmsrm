services:
  wms-db:
    image: postgres:15-alpine
    container_name: wms-db
    restart: unless-stopped
    ports:
      - "3013:5432"
    environment:
      - POSTGRES_USER=wms_user
      - POSTGRES_PASSWORD=wms_password
      - POSTGRES_DB=wms_db
    volumes:
      - wms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d wms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  wms-backend:
    build:
      context: ./rm/backend
      dockerfile: Dockerfile
    container_name: wms-backend
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - DATABASE_URL=postgresql://wms_user:wms_password@wms-db:5432/wms_db
      - JWT_SECRET=dev_secret
      - PORT=3011
    depends_on:
      wms-db:
        condition: service_healthy

  wms-frontend:
    build:
      context: ./rm/frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_API_URL=http://wms-backend:3011
        - NEXT_PUBLIC_APP_VERSION=1.2.0
    container_name: wms-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://wms-backend:3011
    depends_on:
      - wms-backend

volumes:
  wms_db_data:
