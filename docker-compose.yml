services:
  wms-test-db:
    image: postgres:15-alpine
    container_name: wms-test-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    ports:
      - "3013:5432"
    environment:
      - POSTGRES_USER=wms_user
      - POSTGRES_PASSWORD=wms_password
      - POSTGRES_DB=wms_db
    volumes:
      - wms_db_data:/var/lib/postgresql/data
      - ./wms-test/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./wms-test/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  wms-test:
    image: ghcr.io/${GHCR_OWNER:-saiflll}/wms-test:latest
    build:
      context: .
      dockerfile: wms-test/Dockerfile
    container_name: wms-test
    restart: unless-stopped
    mem_limit: 1200m
    cpus: 1.00
    ports:
      - "3014:3011"
      - "3015:3000"
    environment:
      - DATABASE_URL=postgresql://wms_user:wms_password@wms-test-db:5432/wms_db
      - JWT_SECRET=rm_super_secret_key_change_me
    depends_on:
      - wms-test-db

volumes:
  wms_db_data:
