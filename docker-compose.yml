services:
  test-wms:
    build:
      context: .
      dockerfile: wms-test/Dockerfile
    container_name: test-wms
    restart: unless-stopped
    ports:
      - "3012:5432"
      - "3011:3011"
      - "3015:3000"
    # volumes:
    #   - test-wms-postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=wms_user
      - POSTGRES_PASSWORD=wms_password
      - POSTGRES_DB=wms_db
      - JWT_SECRET=rm_super_secret_key_change_me

# volumes:
#   test-wms-postgres_data:
#     driver: local
