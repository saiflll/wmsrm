name: Deploy WMS Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bersihin container lama
        run: |
          docker compose down --remove-orphans --volumes 2>/dev/null
          docker rm -f test-wms 2>/dev/null

      - name: Build & start
        run: |
          docker compose build --no-cache
          docker compose up -d

      - name: Cek status
        run: |
          docker ps --filter "name=wms-"
          docker logs wms-frontend --tail 20
          docker logs wms-backend --tail 20
