name: Deploy WMS to Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop & remove old containers
        run: |
          docker compose down --remove-orphans --volumes 2>/dev/null || true
          # Force hapus container wms-test kalau masih nyangkut
          docker rm -f wms-test 2>/dev/null || true

      - name: Build & start containers
        run: |
          docker compose build --no-cache
          docker compose up -d

      - name: Verify running
        run: |
          echo "--- Container Status ---"
          docker ps --filter "name=wms-test"
          echo "--- Recent Logs ---"
          docker logs wms-test --tail 30
