name: Build, Push GHCR & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push ke GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU & Buildx
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/wms-test
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: wms-test/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke VPS
    needs: build-push
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & Start
        run: |
          docker compose pull wms-test
          docker compose up -d

      - name: Cek status
        run: |
          docker ps --filter "name=wms-"
          docker logs wms-test --tail 50