name: Deploy WMS Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bersihin container lama
        run: |
          docker compose down --remove-orphans --volumes 2>$null
          docker rm -f wms-test 2>$null

      - name: Build & start
        run: |
          docker compose build --no-cache
          docker compose up -d

      - name: Cek status
        run: |
          docker ps --filter "name=wms-test"
          docker logs wms-test --tail 20
