name: Deploy WMS to Server

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Stop and Remove existing Containers (including DB to resolve conflicts)
        run: |
          docker stop wms_frontend wms_backend wms_db || true
          docker rm wms_frontend wms_backend wms_db || true

      - name: Build and Run Docker Containers
        run: |
          docker compose build --no-cache
          docker compose up -d --no-recreate

      - name: Prune unused Docker images and builders
        run: |
          docker image prune -f
          docker builder prune -f
