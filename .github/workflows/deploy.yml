name: Deploy WMS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop existing stack and clean volume
        run: |
          docker compose down -v --remove-orphans || true
          docker volume rm cek_wms-test-postgres_data 2>/dev/null || true

      - name: Build and start all services
        run: |
          docker compose up -d --build

      - name: Health check – wait for wms-test
        run: |
          echo "Waiting for wms-test to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' wms-test 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "wms-test is healthy!"
              break
            fi
            echo "Attempt $i: status = $STATUS"
            sleep 5
          done

      - name: Prune unused Docker images
        run: |
          docker image prune -f
          docker builder prune -f
