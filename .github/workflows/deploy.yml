name: Test, Build & Push GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-push:
    name: Test, Build & Push ke GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU & Buildx
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/wms-test
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: wms-test/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image dengan PostgreSQL
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          docker network create wms-ci
          docker run -d --name wms-test-db --network wms-ci \
            -e POSTGRES_USER=wms_user \
            -e POSTGRES_PASSWORD=wms_password \
            -e POSTGRES_DB=wms_db \
            postgres:15-alpine
          docker run -d --name wms-test --network wms-ci \
            -p 3014:3011 -p 3015:3000 \
            -e DATABASE_URL=postgresql://wms_user:wms_password@wms-test-db:5432/wms_db \
            -e JWT_SECRET=ci_smoke_test_secret \
            "$IMAGE"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3014/api/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs wms-test
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:3015/ >/dev/null
          LOGIN_RESPONSE="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' \
            http://127.0.0.1:3014/api/auth/login)"
          TOKEN="$(printf '%s' "$LOGIN_RESPONSE" | jq -r '.data.access_token')"
          test -n "$TOKEN"
          test "$TOKEN" != null
          curl --fail --silent -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:3014/api/inventory/dashboard >/dev/null
          curl --fail --silent -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:3014/api/inventory/dashboard/stock-chart >/dev/null

      - name: Tampilkan log jika smoke test gagal
        if: failure()
        run: |
          docker logs wms-test-db 2>/dev/null || true
          docker logs wms-test 2>/dev/null || true

      - name: Push image yang lolos smoke test
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$IMAGE_TAGS" | while IFS= read -r image; do
            [ -n "$image" ] && docker push "$image"
          done
