name: Deploy WMS Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build & start
        run: |
          docker compose build --no-cache
          docker compose up -d

      - name: Cek status
        run: |
          docker ps --filter "name=wms-"
          docker logs wms-test --tail 50
